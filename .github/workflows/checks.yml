name: LCE checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        shell: bash
        run: |
          echo '### JavaScript bundle size (bytes)' >> "$GITHUB_STEP_SUMMARY"
          wc -c dist/assets/*.js >> "$GITHUB_STEP_SUMMARY"
          echo '### Compressed app size (bytes)' >> "$GITHUB_STEP_SUMMARY"
          gzip -c dist/assets/app.js | wc -c >> "$GITHUB_STEP_SUMMARY"
