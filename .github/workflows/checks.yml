name: LCE checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Checkout PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base
      - name: Build PR base
        if: github.event_name == 'pull_request'
        working-directory: .ci-base
        run: npm ci && npm run build
      - name: Compare PR bundle size
        if: github.event_name == 'pull_request'
        run: node scripts/bundle-size.mjs dist/assets .ci-base/dist/assets
      - name: Report manual build size
        if: github.event_name != 'pull_request'
        run: node scripts/bundle-size.mjs
